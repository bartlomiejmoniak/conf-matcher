name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The data gate first: DATA_GUIDE's "before committing" checks, as code.
      - run: npm run validate
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
